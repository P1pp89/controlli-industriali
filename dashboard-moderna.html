<!-- dashboard-moderna.html -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Monitoraggio - Gestione Impianti</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; color: #1e293b; padding: 20px; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .tab-header { border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; padding-bottom: 10px; font-weight: bold; font-size: 1.2rem; color: #0f172a; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 15px; }
        .data-table th, .data-table td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        .data-table th { background: #f1f5f9; color: #475569; font-weight: 600; }
        .text-center { text-align: center; }
        .text-muted { color: #64748b; }
        .badge-pending { background: #fef3c7; color: #d97706; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }
        .btn-action { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-action:hover { background: #059669; }
        code { font-family: monospace; color: #0284c7; background: #f0f9ff; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="tab-header">📱 Gestione Tag NFC Pendenti (Registrazione Asset)</div>
    
    <table class="data-table">
        <thead>
            <tr>
                <th>UID Hardware</th>
                <th>Nome Suggerito</th>
                <th>Tipo Categoria</th>
                <th>Coordinate GPS Rilevate</th>
                <th>Stato Ricezione</th>
                <th>Azione Manutentiva</th>
            </tr>
        </thead>
        <tbody id="nfc-pending-container">
            <tr>
                <td colspan="6" class="text-center text-muted">Caricamento e normalizzazione registri in corso...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Integrazione API Client Aziendale -->
<script src="./api-client.js"></script>
<script>
    // Istanza di inizializzazione locale per l'interazione asincrona
    const SUPABASE_URL = 'https://pynodlnwozlyxcfwfqvp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_C61rsZm3YWmvz82MHGkTAg_RGQQXCL6';
    const api = new ControlsAPI(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', function() {
        refreshUnknownTagsTable();
    });

    /**
     * Recupera i record dal cloud ed esegue il rendering protetto contro il crash del ciclo .forEach
     */
    async function refreshUnknownTagsTable() {
        const container = document.getElementById("nfc-pending-container");
        if (!container) return;

        try {
            // Chiamata asincrona protetta definita nell'api-client riscritta
            const pendingData = await api.getUnknownTags('PENDING');
            
            container.innerHTML = ""; 

            // --- ENFORCEMENT PREVENTIVO DEL TIPO DI DATO (AZZERAMENTO BUG COMPLETATO) ---
            let cleanArray = [];
            if (Array.isArray(pendingData)) {
                cleanArray = pendingData;
            } else if (pendingData && typeof pendingData === 'object') {
                cleanArray = Object.values(pendingData);
            }

            if (cleanArray.length === 0) {
                container.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Nessun tag NFC in attesa di autorizzazione o associazione</td></tr>`;
                return;
            }

            // Esecuzione iterativa in totale isolamento logico
            cleanArray.forEach(tag => {
                const row = document.createElement("tr");
                
                const uid = escapeHtml(tag.tag_id || tag.uid || 'N/A');
                const name = escapeHtml(tag.suggested_name || 'Asset non catalogato');
                const category = escapeHtml(tag.suggested_category || 'Generica');
                const lat = tag.gps_lat ? parseFloat(tag.gps_lat).toFixed(6) : null;
                const lng = tag.gps_lng ? parseFloat(tag.gps_lng).toFixed(6) : null;
                const gpsInfo = (lat && lng) ? `📍 ${lat}, ${lng}` : '❌ Assente';
                const status = escapeHtml(tag.status || 'PENDING');

                row.innerHTML = `
                    <td><code>${uid}</code></td>
                    <td>${name}</td>
                    <td>${category}</td>
                    <td>${gpsInfo}</td>
                    <td><span class="badge-pending">${status}</span></td>
                    <td>
                        <button class="btn-action" onclick="assegnaAssetLocale('${uid}')">Approva e Mappa</button>
                    </td>
                `;
                container.appendChild(row);
            });

        } catch (error) {
            console.error("[UI EMERGENCY INTERVENTION] Errore critico ciclo rendering:", error);
            container.innerHTML = `<tr><td colspan="6" class="text-center" style="color:#ef4444; font-weight:600;">Eccezione interna nell'elaborazione del tracciato dati.</td></tr>`;
        }
    }

    function assegnaAssetLocale(tagId) {
        console.log(`Avvio associazione geometrica per l'apparato: ${tagId}`);
        // Logica di instradamento al portale amministrativo locale
    }

    function escapeHtml(str) {
        if (typeof str !== 'string') return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
